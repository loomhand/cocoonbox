syntax = "proto3";

package cocoonbox.agent.v1;

option go_package = "github.com/loomhand/cocoonbox/api/gen/cocoonbox/agent/v1;agentv1";

// Agents and Session are served by cocoonbox-agent inside the box. Clients
// reach them through the edge with `authorization: Bearer <user token>` and
// `x-cocoonbox-box: <box id>`; the edge forwards the call unchanged.
service Agents {
  rpc Create(CreateAgentRequest) returns (Agent);
  rpc List(ListAgentsRequest) returns (ListAgentsResponse);
  // Send queues a user turn. Duplicate client_nonce values return the first result.
  rpc Send(SendRequest) returns (SendResponse);
  rpc Transcript(TranscriptRequest) returns (TranscriptPage);
  rpc Respond(RespondRequest) returns (RespondResponse);
  rpc Cancel(CancelRequest) returns (CancelResponse);
  // Rename sets the agent's name; an automatic title never replaces it.
  rpc Rename(RenameAgentRequest) returns (Agent);
  // Delete cancels the agent's running turn and removes the agent with its
  // transcript. An mcp:* agent whose MCP session is open is refused with
  // FAILED_PRECONDITION; an unknown agent gets NOT_FOUND.
  rpc Delete(DeleteAgentRequest) returns (DeleteAgentResponse);
  // End closes the MCP session that drives agent_id, or every MCP session of
  // share_id; the agents and their transcripts stay. An agent_id without an
  // open session gets NOT_FOUND.
  rpc End(EndRequest) returns (EndResponse);
}

enum AgentStatus {
  AGENT_STATUS_UNSPECIFIED = 0;
  AGENT_STATUS_IDLE = 1;
  AGENT_STATUS_RUNNING = 2;
  AGENT_STATUS_WAITING_FOR_USER = 3;
  AGENT_STATUS_FAILED = 4;
}

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_USER = 1;
  ROLE_ASSISTANT = 2;
  ROLE_TOOL = 3;
  ROLE_SYSTEM = 4;
}

message Agent {
  string id = 1;
  string name = 2;
  AgentStatus status = 3;
  string main_model = 4;
  int64 created_at_ms = 5;
  int64 updated_at_ms = 6;
}

message CreateAgentRequest {
  // Empty names the agent after the first line of its first message, cut to
  // 24 characters; until then its name is "agent".
  string name = 1;
  string client_nonce = 2;
  // Empty selects the box default.
  string main_model = 3;
}

message ListAgentsRequest {}

message ListAgentsResponse {
  repeated Agent agents = 1;
}

message Attachment {
  string name = 1;
  string mime_type = 2;
  bytes data = 3;
}

message SendRequest {
  string agent_id = 1;
  string text = 2;
  repeated Attachment attachments = 3;
  string client_nonce = 4;
}

message SendResponse {
  string turn_id = 1;
}

message TranscriptRequest {
  string agent_id = 1;
  // Entries with seq > after_seq, oldest first.
  uint64 after_seq = 2;
  uint32 limit = 3;
}

message TranscriptPage {
  repeated TranscriptEntry entries = 1;
  bool has_more = 2;
}

message TranscriptEntry {
  uint64 seq = 1;
  string agent_id = 2;
  string turn_id = 3;
  Role role = 4;
  int64 at_ms = 5;
  oneof body {
    TextBlock text = 10;
    ReasoningBlock reasoning = 11;
    ToolCall tool_call = 12;
    ToolResult tool_result = 13;
    ApprovalRequest approval = 14;
    TurnEnd turn_end = 15;
  }
}

message TextBlock {
  string text = 1;
  // Set when the text belongs to a subagent, e.g. "computer".
  string subagent = 2;
  // Index of the streamed block within its turn; matches TextDelta.block.
  uint32 block = 3;
}

message ReasoningBlock {
  string text = 1;
  // Index of the streamed block within its turn; matches ReasoningDelta.block.
  uint32 block = 2;
  string subagent = 3;
}

message ToolCall {
  string call_id = 1;
  string name = 2;
  string arguments_json = 3;
  // Set when the call belongs to a subagent, e.g. "computer".
  string subagent = 4;
}

message ToolResult {
  string call_id = 1;
  bool is_error = 2;
  string text = 3;
  // PNG when the tool produced a screenshot.
  bytes image = 4;
}

message ApprovalRequest {
  string approval_id = 1;
  string summary = 2;
  // "take_over": the agent hands the screen to the user (login, captcha, payment).
  // "connector": a Connect tool call that needs the user's approval; approval_id is the broker's apr_… id,
  // which the app answers with Connectors.Approve and then Agents.Respond.
  string kind = 3;
}

message TurnEnd {
  bool ok = 1;
  string error = 2;
  Usage usage = 3;
}

message Usage {
  uint64 input_tokens = 1;
  uint64 output_tokens = 2;
  uint64 cached_input_tokens = 3;
  repeated ModelUsage models = 4;
}

message ModelUsage {
  string model = 1;
  uint64 calls = 2;
  uint64 input_tokens = 3;
  uint64 output_tokens = 4;
  uint64 cached_input_tokens = 5;
}

message RespondRequest {
  string agent_id = 1;
  string approval_id = 2;
  bool approve = 3;
  string text = 4;
}

message RespondResponse {}

message CancelRequest {
  string agent_id = 1;
}

message CancelResponse {}

message RenameAgentRequest {
  string agent_id = 1;
  // Trimmed; empty is INVALID_ARGUMENT.
  string name = 2;
}

message DeleteAgentRequest {
  string agent_id = 1;
}

message DeleteAgentResponse {}

message EndRequest {
  oneof target {
    string agent_id = 1;
    string share_id = 2;
  }
}

message EndResponse {}
