syntax = "proto3";

package cocoonbox.control.v1;

option go_package = "github.com/loomhand/cocoonbox/api/gen/cocoonbox/control/v1;controlv1";

// Connectors is served by cocoonbox-api for the caller's own external accounts
// (design §16), with `authorization: Bearer <user token>`. The api holds every
// grant; no message carries a token, a refresh token or an API key.
service Connectors {
  // Catalog lists the connectors the api offers.
  rpc Catalog(CatalogRequest) returns (CatalogResponse);
  // List returns the caller's connected accounts.
  rpc List(ListConnectorsRequest) returns (ListConnectorsResponse);
  // Begin returns the console page that connects the account. The console
  // binds the flow to its own session, so the app opens the URL in the browser.
  rpc Begin(BeginConnectRequest) returns (BeginConnectResponse);
  // Disconnect revokes the grant at the vendor where the vendor offers a
  // revoke call, then deletes it; its tools leave every MCP session.
  rpc Disconnect(ConnectorRef) returns (DisconnectResponse);
  // SetPolicy sets one tool's policy; POLICY_UNSPECIFIED returns it to the default.
  rpc SetPolicy(SetPolicyRequest) returns (Connector);
  // Approve answers an approval-required call from a box (§16.5).
  rpc Approve(ApproveRequest) returns (ApproveResponse);
  // Activity returns the caller's audit records, newest first.
  rpc Activity(ActivityRequest) returns (ActivityResponse);
  // SpendRequests returns the caller's Link spend requests that wait for the
  // user. The api reads Link on this call when its last read is older than
  // 30 seconds, and answers from that read in between.
  rpc SpendRequests(SpendRequestsRequest) returns (SpendRequestsResponse);
}

enum Policy {
  // The default: allow for a tool with readOnlyHint, ask for every other tool.
  POLICY_UNSPECIFIED = 0;
  POLICY_ALLOW = 1;
  POLICY_ASK = 2;
  POLICY_OFF = 3;
}

enum ApprovalDecision {
  APPROVAL_DECISION_UNSPECIFIED = 0;
  // Allows the one call with the same arguments within 10 minutes.
  APPROVAL_DECISION_ONCE = 1;
  // Allows the call once and sets the tool's policy to POLICY_ALLOW.
  APPROVAL_DECISION_ALWAYS = 2;
  APPROVAL_DECISION_DENY = 3;
}

message CatalogEntry {
  // The connector's id, such as `github`, or `custom` for any MCP server by URL.
  string id = 1;
  string name = 2;
  string description = 3;
  // False when the api has no OAuth client for the vendor.
  bool available = 4;
  // Where the user picks the repositories of the GitHub App; empty otherwise.
  string install_url = 5;
  // The vendor has no MCP server the api uses: the grant serves no tools, and programs in the box will use it through egress injection (M5.2).
  bool grant_only = 6;
  // The console can check the grant against the vendor's user endpoint, refreshing it first when it is near expiry.
  bool checkable = 7;
  // The MCP server of the connector; empty for a grant-only connector and for `custom`.
  string mcp_url = 8;
  // How the user connects: `oauth` with the api's own client, `mcp` by the MCP server's own sign-in, `none` without a sign-in, or `custom`.
  string auth = 9;
  // An image of the vendor's icon; empty when the catalog names none.
  string icon_url = 10;
}

message CatalogRequest {}

message CatalogResponse {
  repeated CatalogEntry entries = 1;
}

message Connector {
  // The catalog id, or the name the user gave a custom connector. Tool names
  // start with it: `<id>_<tool>`.
  string id = 1;
  // The catalog entry: `custom` for a custom connector.
  string kind = 2;
  string name = 3;
  // The vendor account, such as a GitHub login or an email address; empty when the vendor names none.
  string account = 4;
  // `active`, or `needs_reconnect` after the vendor refused the grant.
  string status = 5;
  repeated string scopes = 6;
  string mcp_url = 7;
  // Only when ListConnectorsRequest.with_tools is set.
  repeated ConnectorTool tools = 8;
  int64 connected_at_ms = 9;
  // Why the tools could not be listed, such as the MCP server's refusal; empty otherwise.
  string tools_error = 10;
}

message ConnectorTool {
  // The upstream name; the MCP doors serve it as `<connector id>_<name>`.
  string name = 1;
  string title = 2;
  string description = 3;
  bool read_only = 4;
  bool destructive = 5;
  // The user's choice; POLICY_UNSPECIFIED is the default.
  Policy policy = 6;
  // The policy the broker applies.
  Policy effective = 7;
}

message ListConnectorsRequest {
  // Lists each connector's tools from its MCP server.
  bool with_tools = 1;
}

message ListConnectorsResponse {
  repeated Connector connectors = 1;
}

message BeginConnectRequest {
  string connector_id = 1;
}

message BeginConnectResponse {
  // `<endpoint>/cb/connect?connect=<connector id>`.
  string url = 1;
}

message ConnectorRef {
  string connector_id = 1;
}

message DisconnectResponse {
  // False when the vendor has no revoke call or refused it; the grant is deleted either way.
  bool revoked = 1;
}

message SetPolicyRequest {
  string connector_id = 1;
  // The upstream tool name.
  string tool = 2;
  Policy policy = 3;
}

message ApproveRequest {
  string approval_id = 1;
  ApprovalDecision decision = 2;
}

message ApproveResponse {}

message ActivityRequest {
  // Empty for every connector.
  string connector_id = 1;
  // 0 selects 50; at most 500.
  int32 limit = 2;
}

message ActivityResponse {
  repeated ActivityEntry entries = 1;
}

message ActivityEntry {
  int64 at_ms = 1;
  string connector_id = 2;
  string tool = 3;
  // `mcp` (mode B), `box` (mode A), or `console` and `app` for a disconnect.
  string door = 4;
  string caller = 5;
  // `allow`, `approved`, `denied`, `off`, `approval_required`, `needs_reconnect` or `disconnect`.
  string decision = 6;
  // The upstream HTTP status, 0 when no request was sent or no answer came.
  int32 upstream_status = 7;
  int64 latency_ms = 8;
  int64 request_bytes = 9;
  int64 response_bytes = 10;
  // Hex SHA-256 of the canonical JSON of the arguments; never the arguments.
  string args_hash = 11;
  // `ok`, `error` or `outcome_unknown`.
  string outcome = 12;
}

message SpendRequestsRequest {}

message SpendRequestsResponse {
  repeated SpendRequest requests = 1;
  // When the api last read them; 0 before the first read and without an active Link grant.
  int64 polled_at_ms = 2;
}

message SpendRequest {
  // Link's id, `lsrq_…`.
  string id = 1;
  // In the currency's smallest unit, such as cents.
  int64 amount = 2;
  string currency = 3;
  string merchant_name = 4;
  string merchant_url = 5;
  // `pending_approval`, or `requires_action` while the user must finish a step such as 3-D Secure.
  string status = 6;
  // Where the user approves it on the web; the Link app shows it too.
  string approval_url = 7;
  int64 created_at_ms = 8;
  // 0 when Link names no expiry.
  int64 expires_at_ms = 9;
}
