apiVersion: v1
kind: Namespace
metadata:
  name: cocoonbox
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cocoonbox-api
  namespace: cocoonbox
---
apiVersion: v1
kind: Secret
metadata:
  name: cocoonbox-api-token
  namespace: cocoonbox
  annotations:
    kubernetes.io/service-account.name: cocoonbox-api
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cocoonbox-api
  namespace: cocoonbox
rules:
  - apiGroups: ["cocoonset.cocoonstack.io"]
    resources: ["cocoonsets"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  # Root in every box of the namespace: the api writes each box's identity file and gw key through exec.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cocoonbox-api
  namespace: cocoonbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cocoonbox-api
subjects:
  - kind: ServiceAccount
    name: cocoonbox-api
    namespace: cocoonbox
