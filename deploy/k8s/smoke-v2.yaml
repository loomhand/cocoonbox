apiVersion: cocoonset.cocoonstack.io/v1
kind: CocoonSet
metadata:
  name: smoke
  namespace: cocoonbox
spec:
  nodePool: default
  snapshotPolicy: never
  agent:
    image: cocoonbox-desktop-v2
    mode: clone
    network: cb
    probePort: 7443
    resources:
      requests:
        cpu: "2"
        memory: 8Gi
      limits:
        cpu: "2"
        memory: 8Gi
