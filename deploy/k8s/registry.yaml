apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: cb-system
  labels:
    app.kubernetes.io/name: registry
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: registry
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: registry
          image: registry:3
          env:
            - name: REGISTRY_HTTP_ADDR
              value: __HOST_IP__:5000
            - name: REGISTRY_HTTP_DEBUG_ADDR
              value: 127.0.0.1:5003
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
            - name: REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY
              value: /var/lib/registry
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
          readinessProbe:
            httpGet:
              host: __HOST_IP__
              path: /v2/
              port: 5000
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
      volumes:
        - name: data
          hostPath:
            path: /srv/cb/registry
            type: DirectoryOrCreate
