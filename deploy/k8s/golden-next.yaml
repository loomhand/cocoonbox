# golden for the next snapshot: a clone of the current one; 2 CPU of quota keeps it inside the node budget
apiVersion: cocoonset.cocoonstack.io/v1
kind: CocoonSet
metadata:
  name: golden
  namespace: cocoonbox
spec:
  nodePool: default
  snapshotPolicy: never
  agent:
    image: cocoonbox-desktop-v2
    mode: clone
    network: cb
    probePort: 22
    resources:
      requests:
        cpu: "2"
        memory: 8Gi
      limits:
        cpu: "2"
        memory: 8Gi
