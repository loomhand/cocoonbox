apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/cocoonstack/cocoon-operator//config/default?ref=v0.3.8
images:
  - name: ghcr.io/cocoonstack/cocoon-operator
    newTag: v0.3.8
patches:
  - target:
      kind: Deployment
      name: cocoon-operator
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: __HOST_IP__:5000/cb
