version: 2

project_name: cocoonbox

before:
  hooks:
    - sh -c 'cd api && go mod download'

builds:
  - id: cocoonbox-api
    dir: api
    main: ./cmd/cocoonbox-api
    binary: cocoonbox-api
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s
    goos:
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: api
    ids:
      - cocoonbox-api
    formats: [binary]
    name_template: "cocoonbox-api-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: 'checksums.txt'
  extra_files:
    - glob: ./dist-extra/*

release:
  prerelease: auto
  extra_files:
    - glob: ./dist-extra/*

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
