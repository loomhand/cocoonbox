#!/usr/sbin/nft -f
flush ruleset

table inet cocoonbox {
	chain input {
		type filter hook input priority filter; policy drop;
		iif lo accept
		ct state established,related accept
		ct state invalid drop
		ip saddr 10.203.0.1 tcp dport { 22, 7443 } accept
		ip saddr 10.203.0.1 icmp type echo-request accept
		meta l4proto ipv6-icmp accept
	}
}
