Section "ServerFlags"
	Option "DontVTSwitch" "true"
	Option "BlankTime" "0"
	Option "StandbyTime" "0"
	Option "SuspendTime" "0"
	Option "OffTime" "0"
	Option "AutoAddDevices" "true"
	Option "AutoEnableDevices" "true"
EndSection

Section "Module"
	Load "vnc"
EndSection

Section "Device"
	Identifier "dummy"
	Driver "dummy"
	VideoRam 32768
EndSection

Section "Monitor"
	Identifier "monitor"
	HorizSync 5.0 - 1000.0
	VertRefresh 5.0 - 200.0
	Modeline "1280x800_60.00" 83.50 1280 1352 1480 1680 800 803 809 831 -hsync +vsync
	Option "DPMS" "false"
EndSection

Section "Screen"
	Identifier "screen"
	Device "dummy"
	Monitor "monitor"
	DefaultDepth 24
	Option "rfbport" "5900"
	Option "localhost" "1"
	Option "SecurityTypes" "None"
	Option "AlwaysShared" "1"
	SubSection "Display"
		Depth 24
		Modes "1280x800_60.00"
		Virtual 1280 800
	EndSubSection
EndSection

Section "ServerLayout"
	Identifier "layout"
	Screen "screen"
EndSection
