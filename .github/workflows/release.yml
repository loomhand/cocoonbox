# A v* tag runs GoReleaser: cocoonbox-api (linux amd64, arm64) and the changelog, with cocoonbox-agent (linux amd64, arm64),
# the image recipe with its pins and, when the repository variable CB_ENDPOINT names an api origin, CocoonBox.app (ad hoc signed).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  agent:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install protoc
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler

      # the arm64 runner image has no rustup; rust-toolchain.toml then picks the pinned toolchain
      - name: Install rustup
        if: matrix.arch == 'arm64'
        run: |
          command -v rustup || { curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none; echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"; }

      - name: Build
        run: |
          agent/build-release.sh
          cp agent/target/release/cocoonbox-agent cocoonbox-agent-linux-${{ matrix.arch }}

      - name: Upload
        uses: actions/upload-artifact@v7.0.2
        with:
          name: agent-${{ matrix.arch }}
          path: cocoonbox-agent-linux-${{ matrix.arch }}

  app:
    if: vars.CB_ENDPOINT != ''
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Bundle
        env:
          CB_ENDPOINT: ${{ vars.CB_ENDPOINT }}
        run: |
          make app
          ditto -c -k --keepParent macos/dist/CocoonBox.app CocoonBox-macos-arm64.zip

      - name: Upload
        uses: actions/upload-artifact@v7.0.2
        with:
          name: app
          path: CocoonBox-macos-arm64.zip

  release:
    needs: [agent, app]
    if: ${{ !cancelled() && needs.agent.result == 'success' && needs.app.result != 'failure' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Download
        uses: actions/download-artifact@v8.0.2
        with:
          path: dist-extra
          merge-multiple: true

      - name: Image recipe
        run: |
          set -eu
          recipe="cocoonbox-image-recipe-$GITHUB_REF_NAME"
          mkdir -p "$RUNNER_TEMP/$recipe"
          git archive HEAD image | tar -x -C "$RUNNER_TEMP/$recipe"
          {
            echo "release $GITHUB_REF_NAME"
            echo "commit $GITHUB_SHA"
            echo "agent-sha256 $(sha256sum dist-extra/cocoonbox-agent-linux-amd64 | cut -d' ' -f1)"
            echo "agent-arm64-sha256 $(sha256sum dist-extra/cocoonbox-agent-linux-arm64 | cut -d' ' -f1)"
            sed -n -e 's/^COMMIT=${COMMIT:-\(.*\)}$/cua-driver-commit \1/p' -e 's/^VERSION=${VERSION:-\(.*\)}$/cua-driver-version \1/p' image/cua-driver.sh
          } > "$RUNNER_TEMP/$recipe/PINS"
          cat "$RUNNER_TEMP/$recipe/PINS"
          tar -czf "dist-extra/$recipe.tar.gz" -C "$RUNNER_TEMP" "$recipe"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7.3.0
        with:
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOWORK: "off"
