name: api

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "proto/**"
      - "docs/fixtures/**"
      - ".github/workflows/api.yml"
  pull_request:
    paths:
      - "api/**"
      - "proto/**"
      - "docs/fixtures/**"
      - ".github/workflows/api.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Format, lint, test, build
        env:
          GOWORK: "off"
        run: make api
