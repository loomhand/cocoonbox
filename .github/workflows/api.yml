name: api

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "proto/**"
      - "docs/fixtures/**"
      - ".github/workflows/api.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.14@sha256:95206741a5b214807675e14165369d05b93a9cf692223b616d07cca227e74b0b
        env:
          POSTGRES_PASSWORD: cbtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=cbtest -e MINIO_ROOT_PASSWORD=cbtest-secret \
            cgr.dev/chainguard/minio:latest@sha256:616286de6ef3a1892876b126e745e152d8e03add6357203f8a1f854bdd1dce76 server /data
          timeout 60 sh -c 'until curl -fsS http://localhost:9000/minio/health/live; do sleep 1; done'

      - name: Format, lint, test, build
        env:
          GOWORK: "off"
          COCOONBOX_TEST_DSN: postgres://postgres:cbtest@localhost:5432/postgres?sslmode=disable
          COCOONBOX_TEST_S3: http://cbtest:cbtest-secret@localhost:9000
        run: make api
