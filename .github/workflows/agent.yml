# The agent runs in a Linux guest and in a macOS guest, and builds for a Windows guest; the offload tests need rsync and tmux, the script tests Node 24 (NODE_BIN), the Chrome tests skip with CB_NO_BROWSER=1.
name: agent

on:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - "proto/**"
      - "image/desk/**"
      - "image/macos/**"
      - "docs/fixtures/**"
      - ".github/workflows/agent.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install protoc, rsync and tmux
        run: sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler rsync tmux

      - name: Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.21.0

      - name: fmt + clippy + test
        env:
          CB_NO_BROWSER: "1"
        run: NODE_BIN=$(command -v node) make agent

  agent-macos:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install protoc and tmux
        run: brew install protobuf tmux

      - name: Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24.21.0

      - name: fmt + clippy + test
        env:
          CB_NO_BROWSER: "1"
        run: NODE_BIN=$(command -v node) make agent

  agent-windows:
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - name: Allow the rootfs paths in the index
        run: git config --system core.protectNTFS false

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          sparse-checkout: |
            agent
            docs/fixtures
            image/desk
            proto

      - name: Install protoc
        run: choco install protoc --no-progress -y

      - name: clippy + build + lib tests
        working-directory: agent
        env:
          CB_NO_BROWSER: "1"
        run: cargo clippy --all-targets --locked -- -D warnings && cargo build --locked && cargo test --locked --lib
