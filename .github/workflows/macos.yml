# The package resolves swift-rfb at ../../swift-rfb from macos/, so both repos are checked out side by side.
name: macos

on:
  push:
    branches: [main]
    paths:
      - "macos/**"
      - "deskhost/**"
      - "proto/**"
      - ".github/workflows/macos.yml"
  pull_request:
    paths:
      - "macos/**"
      - "deskhost/**"
      - "proto/**"
      - ".github/workflows/macos.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          path: cocoonbox

      - name: Checkout swift-rfb
        uses: actions/checkout@v7.0.1
        with:
          repository: loomhand/swift-rfb
          ref: main
          path: swift-rfb
          ssh-key: ${{ secrets.SWIFT_RFB_DEPLOY_KEY }}

      - name: Select the Command Line Tools
        run: |
          sudo xcode-select -s /Library/Developer/CommandLineTools
          swift --version

      # the suite runs serially: in parallel on the runner's three cores no test finished in 30 minutes;
      # the update-rate gate needs a 30 fps synthetic source, which the runner renders at about 18
      - name: App build and tests
        working-directory: cocoonbox
        run: make macos MACOS_TEST_ARGS="--no-parallel --skip updateRateAcrossALongPath"

      - name: App bundle carries the icon
        working-directory: cocoonbox
        env:
          CB_ENDPOINT: https://box.example.com
        run: |
          make app
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' macos/dist/CocoonBox.app/Contents/Info.plist)" = AppIcon
          iconutil -c iconset -o "$RUNNER_TEMP/AppIcon.iconset" macos/dist/CocoonBox.app/Contents/Resources/AppIcon.icns
          ls "$RUNNER_TEMP/AppIcon.iconset"

      - name: Desk host
        working-directory: cocoonbox
        run: make deskhost
