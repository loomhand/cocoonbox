name: gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Clean gate
        run: make gate

      - name: Python tools
        run: |
          python3 -m venv "$RUNNER_TEMP/py"
          "$RUNNER_TEMP/py/bin/pip" install ruff==0.17.4 pytest==9.2.0
          echo "$RUNNER_TEMP/py/bin" >> "$GITHUB_PATH"

      - name: Image scripts
        run: make image
